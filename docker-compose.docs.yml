services:
  docs:
    image: project_local_docs
    container_name: project_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - path: ./.envs/.local/.django
        required: false
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./project:/app/project:z
    ports:
      - '9000:9000'
    command: /start-docs
